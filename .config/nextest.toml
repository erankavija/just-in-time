nextest-version = "0.9.133"

[profile.default]
retries = 0

# Per-test limits by layer, derived in dev/benchmarks/per-test-durations-1eb949a5/README.md.
# A test still running at its layer's limit is terminated and fails the run as TIMEOUT.
# The profile default is the unit limit: lib and bin targets, and any other non-test kind.
slow-timeout = { period = "2s", terminate-after = 1 }

# Explicitly pins nextest's default leak timeout.
# Verified from the pinned tag source: https://raw.githubusercontent.com/nextest-rs/nextest/cargo-nextest-0.9.133/nextest-runner/default-config.toml
leak-timeout = "200ms"

# Integration limit: every `crates/*/tests/*` target.
[[profile.default.overrides]]
filter = "kind(test)"
slow-timeout = { period = "6s", terminate-after = 1 }
