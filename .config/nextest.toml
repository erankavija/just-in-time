nextest-version = "0.9.133"
experimental = ["setup-scripts"]

[scripts.setup.default-repository-fixture]
command = { command-line = "debug/jit __test-fixture-setup jit-default", relative-to = "target" }
slow-timeout = { period = "15s", terminate-after = 4 }

[[profile.default.scripts]]
filter = '''
(binary(cli_item_validate) & (test(/^invariant_registry_story_tests::/) | test(/^item_cli_tests::/) | test(/^project_render_cli_tests::/) | test(/^type_hierarchy_fix_tests::/) | test(/^validate_cli_rule_tests::/))) |
(binary(jit) & test(/^(commands::init::tests::test_single_profile_reinit_attributes_coupled_schema_repair|commands::profile::tests::test_profile_preparation_retries_when_final_proposed_closure_expands)$/))
'''
setup = 'default-repository-fixture'

[scripts.setup.dogfood-repository-fixture]
command = { command-line = "debug/jit __test-fixture-setup jit-dogfood", relative-to = "target" }
slow-timeout = { period = "15s", terminate-after = 4 }

[[profile.default.scripts]]
filter = '''
((binary(cli_item_validate) | binary(fast_rules)) & test(/^derived_state_repair_tests::/)) |
(binary(jit) & test(/^(commands::init::tests::test_reinit_profiled_over_existing_root_is_idempotent_unchanged|commands::profile::tests::test_apply_profile_selection_recovers_an_obsolete_default_schema_atomically|commands::validate::tests::test_validate_fix_repairs_every_owned_materialization_and_preserves_unowned_files|commands::validate::tests::test_validate_fix_rejects_ambiguous_region_without_writing_other_repairs|commands::validate::tests::test_validate_fix_repairs_owned_materializations_in_memory|commands::validate::tests::test_validate_fix_rejects_ambiguous_region_without_memory_writes|commands::validate::tests::test_capture_repair_plan_with_recorded_profile_captures_and_repairs_its_targets|commands::validate::tests::test_validate_diagnoses_non_profile_drift_identically_across_record_states)$/))
'''
setup = 'dogfood-repository-fixture'

[scripts.setup.recorded-failure-corpus]
command = { command-line = "scripts/setup-recorded-failure-corpus.sh", relative-to = "workspace-root" }
slow-timeout = { period = "15s", terminate-after = 4 }
capture-stdout = true
capture-stderr = true

[[profile.default.scripts]]
filter = '''
binary(cli_issue) & test(/^(failure_envelope_contract_tests::test_recorded_failure_arms_emit_the_canonical_error_envelope|failure_probe_coverage_tests::test_failure_probe_coverage_matches_clap_arms_and_emits_typed_envelopes|payload_stream_purity_tests::test_machine_readable_failures_emit_one_json_document_on_payload_stream)$/)
'''
setup = 'recorded-failure-corpus'

[profile.default]
retries = 0

# 15s × 4 = 60s hard per-test bound.
slow-timeout = { period = "15s", terminate-after = 4 }

# Explicitly pins nextest's default leak timeout.
# Verified from the pinned tag source: https://raw.githubusercontent.com/nextest-rs/nextest/cargo-nextest-0.9.133/nextest-runner/default-config.toml
leak-timeout = "200ms"
