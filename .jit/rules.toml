# .jit/rules.toml — the operative source of truth for issue/label validation.
#
# Generated by `jit init`. Custom rules (any `origin` other than "default") are
# fully editable, including the `schemas/*.json` files they reference. The
# built-in rules marked `origin = "default"` are editable for policy (severity,
# enforce, selector), but their assertion is derived from the `[namespaces]` /
# `[type_hierarchy]` registry in `config.toml` in memory at load; the matching
# `schemas/default-*.json` files are regenerated projections for external
# consumers, not the validation authority. Change what a default rule checks by
# editing that registry.

[[rules]]
name = "label-format"
origin = "default"
description = "Every label must match the canonical `namespace:value` format (namespace lowercase-kebab, value non-empty). Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { json-schema = "schemas/default-label-format.json" }

[[rules]]
name = "namespace-registry"
origin = "default"
description = "Every label's namespace must be declared in the namespace registry. An unknown namespace fails validation but never blocks a write."
severity = "error"
enforce = false
assert = { json-schema = "schemas/default-namespace-registry.json" }

[[rules]]
name = "type-hierarchy-known"
origin = "default"
description = "Every `type:<value>` label must name a type declared in the configured type hierarchy. An unknown type fails validation but never blocks a write."
severity = "error"
enforce = false
assert = { json-schema = "schemas/default-type-hierarchy-known.json" }

[[rules]]
name = "namespace-unique-resolution"
origin = "default"
description = "At most one `resolution:` label per issue: `resolution` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "resolution:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-team"
origin = "default"
description = "At most one `team:` label per issue: `team` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "team:*", min = 0, max = 1 } }

[[rules]]
name = "namespace-unique-type"
origin = "default"
description = "At most one `type:` label per issue: `type` is a unique namespace. Blocks the write and fails validation."
severity = "error"
enforce = true
assert = { require-label = { label = "type:*", min = 0, max = 1 } }

[[rules]]
name = "coverage-preview"
origin = "bracket"
description = "On a breakdown node, assert every [hard] REQ-id in the bracketed container's Success Criteria is credited by some issue in its dependency closure via a satisfies:<id> label. A plan-time coverage preview; fires once breakdown is underway."
# Fires on the breakdown node B, redirects to its bracketed container C via the
# brackets: label, and asserts every [hard] REQ-id in C's Success Criteria is
# credited by some issue in C's dependency closure (stories/tasks) carrying a
# satisfies:<id> label. The breakdown/planning nodes bound the walk. No
# child-state: coverage is a plan-time preview, so backlog children count.
# State-gated on the breakdown node: a freshly-applied bracket leaves B in
# backlog (it depends on the planning node), and breakdown has not begun, so no
# coverage can exist yet — the rule stays silent. It enforces only once breakdown
# is underway (in_progress), as its own gate runs (gated), and after (done).
when = { type = "breakdown", state = ["in_progress", "gated", "done"] }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", container-from-label = "brackets", child-link = "dependencies", child-type-exclude = ["breakdown", "planning"] } }

[[rules]]
name = "orphan-leaf"
origin = "default"
description = "Warn when a leaf-level-typed issue (a type at the deepest hierarchy level, e.g. task) carries no parent-membership label (e.g. `epic:*`), leaving it unattached to any strategic container. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "orphan-leaf" } }

[[rules]]
name = "strategic-consistency"
origin = "default"
description = "Warn when a strategic-typed issue (a type with a membership namespace, e.g. epic/milestone) lacks its own identifying membership label, such as a `type:epic` issue that has no `epic:*` label. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "strategic-consistency" } }

