[[gates]]
version = 1
key = "cargo-ci"
title = "Cargo CI (fmt + clippy + tests + build policy)"
description = "Full Rust CI pipeline: formatting check, zero-warning clippy, the workspace test suite compiled in its own step and then measured by the named suite clock, the excluded-tests check that fails the run when the suite reports a skipped test or the doctest step reports an ignored one (@/invariant/no-ignored-tests), and the build-footprint budget checker (integration-target, active-executable, and measured suite-duration budgets, profile, and dependency-feature policy; scripts/rust-build-budget.sh) must all pass (@/invariant/bounded-rust-build-footprint). The run owns and removes its temporary directory: every step runs with TMPDIR set to a directory made inside the caller's temporary directory, a compiler-cache server keeps the caller's TMPDIR, and the directory is removed when the run exits, whether it passes, fails or is interrupted by a signal the script traps. The checker exits 1 for a verdict on repository content and 75 (recorded as an `error` run, never reused through digest reuse) when every failing step is environment-sensitive: a step whose output reports ENOSPC (`No space left on device` or os error 28) with no other failure, whatever the load, or test TIMEOUT results with no FAIL, or a suite-duration-only budget overrun, with the host load average at or above the threshold printed in the run output; the header of scripts/cargo-ci.sh defines the convention. A persistent budget overrun or timeout at low load exits 1 and is a real regression to investigate, not to retry."
stage = "postcheck"
mode = "auto"
priority = 100

[gates.checker]
type = "exec"
command = "./scripts/cargo-ci.sh"
timeout_seconds = 900
pass_context = false

[gates.checker.env]

# Inputs: the worktree root. The Rust suites this gate runs read the repository
# itself (the profile package's live-source conformance walks the worktree and
# the documentation projections compare against docs/), so the footprint is the
# tree. The walk consults no ignore rule, so the exclusions name the git-ignored
# generated and machine-local trees no step opens; the paths jit writes while
# recording results never enter a digest.
[gates.inputs]
roots = ["."]
exclude = [
  ".agents/cache-pool",
  ".agents/worktrees",
  ".claude",
  ".jit/server.log",
  ".jit/server.pid.json",
  "badges",
  "coverage.json",
  "mcp-server/jit-schema.json",
  "mcp-server/node_modules",
  "target",
  "web/dist",
  "web/node_modules",
  "web/test-output.log",
]

[gates.reserved]

