[[gates]]
version = 1
key = "breakdown-review"
title = "AI Breakdown Review"
description = "AI-powered adversarial review of a breakdown against the design doc and content standards"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./contrib/gates/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./contrib/gates/breakdown-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = 'codex exec -m gpt-5.6-sol -c model_reasoning_effort="high"'

[gates.reserved]

[[gates]]
version = 1
key = "cargo-ci"
title = "Cargo CI (fmt + clippy + tests + build policy)"
description = "Full Rust CI pipeline: formatting check, zero-warning clippy, the workspace test suite, the build-provenance contract suites, the build-footprint budget checker (integration-target and active-executable budgets, profile, and dependency-feature policy; scripts/rust-build-budget.sh), and the incremental-state check must all pass (@/invariant/bounded-rust-build-footprint)."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/cargo-ci.sh"
timeout_seconds = 900
pass_context = false

[gates.checker.env]

# Inputs: the whole tracked repository surface, minus the tracker's own
# records. The Rust suites this gate runs read the repository itself —
# the profile package's live-source conformance walks the worktree, the
# build-provenance fixture seeds from every repository input, and the
# documentation projections compare against docs/ — so the footprint is
# the tree, not the workspace alone. The issue records, event log, run
# records and index are excluded: nothing this gate runs opens them, and
# every evaluation rewrites them.
[gates.inputs]
roots = [
  ".agents",
  ".dockerignore",
  ".github",
  ".gitattributes",
  ".gitignore",
  ".jit",
  "AGENTS.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "Cargo.lock",
  "Cargo.toml",
  "Dockerfile",
  "INSTALL.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "contrib",
  "crates",
  "dev",
  "docker-compose.yml",
  "docs",
  "mcp-server",
  "profiles",
  "scripts",
  "test-vectors",
  "web",
]
exclude = [
  ".jit/events.jsonl",
  ".jit/gate-runs/**",
  ".jit/index.json",
  ".jit/issues/**",
]

[gates.reserved]

[[gates]]
version = 1
key = "cargo-ci-features"
title = "Cargo CI (feature-gated parsers)"
description = "Compiles and tests the optional html/xml content-parser features: feature-enabled clippy (zero warnings) and the cross-format parity test suite. Required on issues that touch feature-gated code so the default-only cargo-ci gate does not leave them unexercised."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cargo clippy -p jit --features html,xml --all-targets -- -D warnings && cargo test -p jit --features html,xml"
timeout_seconds = 600
pass_context = false

[gates.checker.env]

# Inputs: the same tree-wide footprint as cargo-ci — the feature-enabled
# run compiles and tests the same crate over the same repository.
# See the cargo-ci declaration for why the footprint is the tree.
[gates.inputs]
roots = [
  ".agents",
  ".dockerignore",
  ".github",
  ".gitattributes",
  ".gitignore",
  ".jit",
  "AGENTS.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "Cargo.lock",
  "Cargo.toml",
  "Dockerfile",
  "INSTALL.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "contrib",
  "crates",
  "dev",
  "docker-compose.yml",
  "docs",
  "mcp-server",
  "profiles",
  "scripts",
  "test-vectors",
  "web",
]
exclude = [
  ".jit/events.jsonl",
  ".jit/gate-runs/**",
  ".jit/index.json",
  ".jit/issues/**",
]

[gates.reserved]

