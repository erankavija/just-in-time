[[gates]]
version = 1
key = "doc-review"
title = "AI Documentation Review"
description = "An issue-scoped documentation-impact review. It uses the repository-configured hierarchy and DAG-resolved descendants to distinguish leaves from containers. A leaf footprint contains only its own individually inspected `jit:<short-id>` commit patches; a container footprint also contains every delivered descendant's patches without absorbing unrelated sequencing dependencies. It derives the smallest impact cone, including required but untouched docs; rather than replaying leaf reviews, container reviews assess the combined documentation contract for workflow coverage, cross-child consistency, canonical placement, discoverability, and aggregate concision. Issue-impact defects fail the gate; unrelated pre-existing drift is advisory. Missing tags fall back to issue intent and linked documents without attributing uncommitted changes. All reviews enforce concise style."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./contrib/gates/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./scripts/doc-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = 'codex exec -m gpt-5.6-terra -c model_reasoning_effort="high"'

[gates.reserved]

[[gates]]
version = 1
key = "docs-mechanical"
title = "Documentation Mechanical Checks"
description = "Deterministic mechanical checks over the adopter-facing documentation surface. Runs ./scripts/docs-mechanical.sh, which fans out to the committed checkers beside it under scripts/ and aggregates their exit statuses, an environment error dominating a finding. Each checker derives both sides of its comparison live from the tree, so the gate encodes no product fact of its own. A checker that takes a footprint receives one: area audits and the container's full-surface run pass their own paths via positional arguments, and this gate supplies the adopter documentation root through the DOCS_FOOTPRINT environment variable. A checker whose targets are fixed by configuration takes none."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/docs-mechanical.sh"
timeout_seconds = 300
pass_context = false

[gates.checker.env]
# The adopter documentation surface, supplied explicitly. The checker defaults
# to this same shipped surface when invoked without an override; repository
# citation scanning and archival permanence are separate configured contracts.
DOCS_FOOTPRINT = "docs/"

# Inputs: the tree-wide footprint. The citation checker scans every
# tracked file and resolves `@/` items through the repository's
# registries; the projection checker re-renders through a jit binary
# built from the workspace. The tracker's records are excluded: no
# checker here opens them, and every evaluation rewrites them.
[gates.inputs]
roots = [
  ".agents",
  ".dockerignore",
  ".github",
  ".gitattributes",
  ".gitignore",
  ".jit",
  "AGENTS.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "Cargo.lock",
  "Cargo.toml",
  "Dockerfile",
  "INSTALL.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "contrib",
  "crates",
  "dev",
  "docker-compose.yml",
  "docs",
  "mcp-server",
  "profiles",
  "scripts",
  "test-vectors",
  "web",
]
exclude = [
  ".jit/events.jsonl",
  ".jit/gate-runs/**",
  ".jit/index.json",
  ".jit/issues/**",
]

[gates.reserved]

