[[gates]]
version = 1
key = "cargo-ci"
title = "Cargo CI (fmt + clippy + tests + build policy)"
description = "Full Rust CI pipeline: formatting check, zero-warning clippy, the workspace test suite under the per-test limits of .config/nextest.toml, which terminate and name a test still running at its layer's limit (unit: lib and bin targets; integration: every crates/*/tests/* target), the excluded-tests check that fails the run when the suite reports a skipped test or the doctest step reports an ignored one (@/invariant/no-ignored-tests), and the build-footprint budget checker (integration-target, active-executable and main.rs production-line budgets, profile, and dependency-feature policy; scripts/rust-build-budget.sh) must all pass (@/invariant/bounded-rust-build-footprint). The run owns and removes its temporary directory: every step runs with TMPDIR set to a directory made inside the caller's temporary directory, a compiler-cache server keeps the caller's TMPDIR, and the directory is removed when the run exits, whether it passes, fails or is interrupted by a signal the script traps. The checker exits 1 for a verdict on repository content and 75 (recorded as an `error` run, never reused through digest reuse) when every failing step is environment-sensitive: a step whose output reports ENOSPC (`No space left on device` or os error 28) with no other failure, whatever the load, or test TIMEOUT results with no FAIL, with the host load average at or above the threshold printed in the run output; the header of scripts/cargo-ci.sh defines the convention. A timeout at low load exits 1 and is a real regression to investigate, not to retry."
stage = "postcheck"
mode = "auto"
priority = 100

[gates.checker]
type = "exec"
command = "./scripts/cargo-ci.sh"
timeout_seconds = 900
pass_context = false

