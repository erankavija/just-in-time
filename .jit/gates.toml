[[gates]]
version = 1
key = "breakdown-review"
title = "AI Breakdown Review"
description = "AI-powered adversarial review of a breakdown against the design doc and content standards"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./scripts/breakdown-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = "codex exec"

[gates.reserved]

[[gates]]
version = 1
key = "cargo-ci"
title = "Cargo CI (fmt + clippy + tests)"
description = "Full Rust CI pipeline: formatting check, zero-warning clippy, and the workspace test suite must all pass."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/cargo-ci.sh"
timeout_seconds = 900
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "cargo-ci-features"
title = "Cargo CI (feature-gated parsers)"
description = "Compiles and tests the optional html/xml content-parser features: feature-enabled clippy (zero warnings) and the cross-format parity test suite. Required on issues that touch feature-gated code so the default-only cargo-ci gate does not leave them unexercised."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cargo clippy -p jit --features html,xml --all-targets -- -D warnings && cargo test -p jit --features html,xml"
timeout_seconds = 600
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "clippy"
title = "Clippy Lints Pass"
description = "Zero clippy warnings allowed"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cargo clippy --lib -- -D warnings"
timeout_seconds = 120
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "code-review"
title = "AI Code Review"
description = "AI-powered code review against just-in-time project standards"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./scripts/code-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = "codex exec"

[gates.reserved]

[[gates]]
version = 1
key = "coverage-preview"
title = "Coverage Preview"
description = "Run scoped validation for the container resolved from the breakdown node's brackets: label; blocks when a [hard] criterion is uncovered at plan time"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/coverage-preview.sh"
timeout_seconds = 300
pass_context = true

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "doc-review"
title = "AI Documentation Review"
description = "AI-powered review of the shipped documentation surface against the current source tree. Apply to any work that adds or changes adopter-facing documentation (the docs/ tree and the product-describing READMEs): it verifies that statements about CLI behavior, storage layout, and repository structure match crates/jit/src and .jit/ config, that repo-local dogfood configuration is signalled as this repository's own, that prose states current behavior with no legacy narration or hand-maintained counts that rot, that links and cited paths resolve, and that content conforms to docs/reference/jit-content-standards.md including Mermaid for all diagrams."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./scripts/doc-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = "codex exec"

[gates.reserved]

[[gates]]
version = 1
key = "docs-mechanical"
title = "Documentation Mechanical Checks"
description = "Deterministic mechanical checks over the adopter-facing documentation surface, each deriving both comparison sides live from the tree so it encodes no product facts: markdown link + heading-anchor resolution (M2), source-path + @/… citation existence (M3), and registry projection freshness (M5, re-runs jit invariant render / jit reference render and diffs the configured targets). Runs ./scripts/docs-mechanical.sh, which fans out to the three committed checkers under scripts/ (docs-check-links.sh, docs-check-citations.sh, docs-check-projections.sh). The footprint is caller-supplied: area audits and the container's full-surface run pass their own paths via positional arguments or the DOCS_FOOTPRINT environment variable; with none supplied the checker defaults to the configured permanent documentation roots (currently docs/)."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/docs-mechanical.sh"
timeout_seconds = 300
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "fmt"
title = "Code Formatted"
description = "Code must be formatted with cargo fmt"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cargo fmt -- --check"
timeout_seconds = 30
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "jit-validate"
title = "JIT Validate"
description = "Per-issue validation must pass (jit validate <ISSUE_ID> exits 0; evaluates only the issue under review)"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = 'jit validate "$JIT_ISSUE_ID"'
timeout_seconds = 120
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "mcp-ci"
title = "MCP CI (mcp-server test suite)"
description = "MCP server workspace checks: the mcp-server unit and integration suites both pass. Covers the workspace that npm-ci (web) and cargo-ci (Rust crates) leave unexercised."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cd mcp-server && npm test"
timeout_seconds = 600
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "npm-ci"
title = "NPM CI (test + lint + build)"
description = "Web workspace checks: vitest suite, ESLint, and production build all clean. Web-side equivalent of cargo-ci."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cd web && npm test -- --run && npm run lint && npm run build"
timeout_seconds = 600
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "plan-review"
title = "AI Plan Review"
description = "AI-powered plan/design review before fan-out, against the planning issue's success criteria and linked design document"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "./scripts/ai-review.sh"
timeout_seconds = 1800
pass_context = true
prompt_file = "./scripts/plan-review-prompt.md"

[gates.checker.env]
REVIEWER_AGENT = "codex exec"

[gates.reserved]

[[gates]]
version = 1
key = "repo-validate"
title = "Repo Validate"
description = "Whole-repository validation must pass (`jit validate` with NO issue id runs run_rules(None) plus the repo-integrity checks); blocks the bound container from reaching Done until the entire repository validates. Distinct from the per-issue jit-validate gate, which scopes to one issue via $JIT_ISSUE_ID."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "jit validate"
timeout_seconds = 120
pass_context = false

[gates.checker.env]

[gates.reserved]

[[gates]]
version = 1
key = "tdd-reminder"
title = "TDD Reminder"
description = "Write tests first"
stage = "precheck"
mode = "manual"
priority = 100
auto = false

[gates.reserved]

[[gates]]
version = 1
key = "tests"
title = "All Tests Pass"
description = "Full test suite must pass"
stage = "postcheck"
mode = "auto"
priority = 100
auto = true

[gates.checker]
type = "exec"
command = "cargo test --lib"
timeout_seconds = 300
pass_context = false

[gates.checker.env]

[gates.reserved]
