# Graph templates (epic 9ac9fdac). DECLARES the named parameterized subgraphs
# that `jit apply <template> <container>` instantiates into the work DAG.
# The mechanism is generic and domain-agnostic: nothing here is hardcoded in
# engine logic — the strings (types, roles, gates, docs) come from THIS file.
# Validated at every `jit` config load by the templates loader (templates.rs):
# roles unique; depends_on/anchor_edges/transforms reference declared
# roles/anchors; node `type`s exist in [type_hierarchy]; internal edges acyclic.

# The block between the delimiters below is GENERATED from the template
# contributions of the packaged jit-dogfood profile, which are their authority:
# edit profiles/jit-dogfood/manifest.toml, then re-render with
# `./scripts/generate-template-region.sh`. Everything outside the delimiters is
# authored here and survives rendering byte for byte. An edit to either
# declaration alone fails the test suite.
#
# Why the container anchor carries `repo-validate` (REQ-13 of issue 552ff75c):
# it is the whole-repo integrity gate on the breakable container.
# `repo-validate` is a CONFIG-DECLARED gate in .jit/gates.toml whose checker
# runs `jit validate` with NO issue id (whole-repo run_rules(None)), distinct
# from the per-issue `jit-validate` gate (`jit validate "$JIT_ISSUE_ID"`). By
# @/invariant/gate-semantics the bound container cannot reach Done until
# whole-repo validation passes.
# jit:plan-template:begin
[[template]]
name = "plan"
description = "Plan-before-fan-out bracket with planning and breakdown review."
applies_to = ["epic"]

[[template.anchors]]
name = "container"
gates = ["repo-validate"]

[[template.nodes]]
role = "planning"
type = "planning"
gates = ["plan-review"]
doc = "{container.dir}/plan.md"
doc_area = "dev/active"
description = "Plan {container.title} ({container.short_id}) against every hard success criterion, write the concise design at {doc} and its authoritative sibling breakdown manifest, and link both to this planning issue."
labels = []
depends_on = []

[[template.nodes]]
role = "breakdown"
type = "breakdown"
gates = ["coverage-preview", "breakdown-review"]
description = "After the plan-review checkpoint passes, decompose the plan for {container.title} ({container.short_id}) into well-ordered implementation issues."
labels = ["brackets:{container.short_id}"]
depends_on = ["planning"]

[[template.anchor_edges]]
from = "container"
to = "breakdown"

[[template.transforms]]
kind = "move-upstream-to-role"
role = "planning"
# jit:plan-template:end
