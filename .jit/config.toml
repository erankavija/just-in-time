# JIT Configuration File (Schema v2)
#
# Single source of truth for all configuration.
# Strategic classification is determined EXCLUSIVELY by type labels.

[version]
schema = 2

[documentation]
# Documentation lifecycle management configuration
development_root = "dev"
managed_paths = ["dev/active", "dev/studies", "dev/sessions"]
archive_root = "dev/archive"
permanent_paths = ["docs/"]

# Archive categories
[documentation.categories]
design = "features"
analysis = "bug-fixes"
refactor = "refactorings"
session = "sessions"
study = "studies"

[type_hierarchy]
# Type name to hierarchy level mapping (lower = more strategic)
# planning/breakdown: bracket-infrastructure types (children of a breakable container).
# Declared here so jit's own tracker dogfoods the plan-before-fan-out bracket (epic 2fbd2a82).
types = { milestone = 1, epic = 2, story = 3, planning = 3, breakdown = 3, task = 4, bug = 4, enhancement = 4 }

# Strategic types - used by 'query strategic' command
strategic_types = ["milestone", "epic"]

# Type → membership label namespace mapping
[type_hierarchy.label_associations]
epic = "epic"
milestone = "milestone"
story = "story"

# The plan-before-fan-out bracket is now declared by the `plan` template in the
# sibling `.jit/templates.toml`, applied via `jit apply plan <container>`.

[validation]
# Strictness level: "strict", "loose", or "permissive"
strictness = "loose"

# Default type when none specified
default_type = "task"

# Label namespace registry (replaces labels.json)
# NO "strategic" flags - strategic is derived from type labels only

[namespaces.type]
description = "Issue type (hierarchical). Exactly one per issue."
unique = true
examples = ["type:task", "type:story", "type:epic", "type:milestone"]

[namespaces.epic]
description = "Feature or initiative membership"
unique = false
examples = ["epic:auth", "epic:production-stability"]

[namespaces.milestone]
description = "Release or time-bounded goal membership"
unique = false
examples = ["milestone:v1.0", "milestone:2026-q1"]

[namespaces.story]
description = "Story membership (optional)"
unique = false
examples = ["story:user-login", "story:checkout"]

[namespaces.component]
description = "Technical area or subsystem"
unique = false
examples = ["component:backend", "component:frontend", "component:cli"]

[namespaces.team]
description = "Owning team"
unique = true
examples = ["team:core", "team:platform"]

[namespaces.resolution]
description = "Reason for issue closure"
unique = true
examples = ["resolution:wont-fix", "resolution:duplicate", "resolution:obsolete"]

[namespaces.brackets]
description = "Planning-bracket container pointer: on a breakdown node, names the container it brackets"
unique = true
examples = ["brackets:2fbd2a82"]

[namespaces.satisfies]
description = "Coverage credit: on an impl child, names a container [hard] criterion id it satisfies (read by the label-coverage gate)"
unique = false
examples = ["satisfies:REQ-01"]

[namespaces.enforces]
description = "Enforcement link: names an invariant, rule, or gate item that the labeled issue enforces"
unique = false
examples = ["enforces:@/invariant/label-format", "enforces:@/rule/label-format", "enforces:@/gate/cargo-ci"]

[namespaces.per]
description = "Decision link: names a decision item (issue-scope `decision` or project-scope `charter`) the labeled issue is done per"
unique = false
examples = ["per:@/charter/D-1", "per:@/issue/9db27a3a/decision/D-1"]

# =============================================================================
# ITEM KINDS
# =============================================================================
# Addressable structured items. The engine bakes in NO kinds; this table is the
# sole source. `jit init` scaffolds the first six (requirement/decision/risk/
# invariant/rule/gate); this repo also dogfoods a `definition` kind over the
# glossary.

[item_kinds.requirement]
section = "success_criteria"
id-pattern = "[A-Z][A-Z0-9]*-[0-9]+"
markers = ["[hard]"]
link-namespaces = ["satisfies"]
scope = "issue"
source-of-truth = "markdown-first"

[item_kinds.decision]
section = "decisions"
id-pattern = "D-[0-9]+"
markers = []
link-namespaces = ["per"]
scope = "issue"
source-of-truth = "markdown-first"

[item_kinds.risk]
section = "risks"
id-pattern = "RISK-[0-9]+"
markers = []
link-namespaces = ["mitigates", "resolves"]
scope = "issue"
source-of-truth = "markdown-first"

[item_kinds.invariant]
section = "success_criteria"
id-pattern = "[a-z][a-z0-9-]*"
markers = []
link-namespaces = ["enforces"]
scope = "project"
source = { toml = ".jit/invariants.toml", table = "invariants", id-field = "id", text-field = "statement" }
source-of-truth = "registry-first"
# Shorthand for space-constrained citations: `@/inv/<self-id>` resolves the same
# item as `@/invariant/<self-id>`.
aliases = ["inv"]

# Rules are colon-free-named entries in `.jit/rules.toml` (the sole validation
# source); the rule kind projects each entry's `name` as its self-id and its
# optional `description` as its display text (falling back to the `name` when a
# rule has no description), addressed at `@/rule/<name>` (e.g.
# `@/rule/coverage-preview`).
[item_kinds.rule]
section = "success_criteria"
id-pattern = "[a-z][a-z0-9-]*"
markers = []
link-namespaces = ["enforces"]
scope = "project"
source = { toml = ".jit/rules.toml", table = "rules", id-field = "name", text-field = "description" }
source-of-truth = "registry-first"

# Gates are kebab-case-keyed entries in `.jit/gates.toml` (the gate registry); the
# gate kind projects each entry's `key` as its self-id and its `description` as
# its display text, addressed at `@/gate/<key>` (e.g. `@/gate/cargo-ci`). Part of
# the `jit init` scaffold (jit:bb7d57a2); a freshly-scaffolded `.jit/gates.toml`
# starts as an EMPTY registry (unlike `rules.toml`, which `jit init` also seeds
# with default rules), so `jit item list --kind gate` returns nothing until a
# gate is defined via `jit gate define`.
[item_kinds.gate]
section = "success_criteria"
id-pattern = "[a-z][a-z0-9-]*"
markers = []
link-namespaces = ["enforces"]
scope = "project"
source = { toml = ".jit/gates.toml", table = "gates", id-field = "key", text-field = "description" }
source-of-truth = "registry-first"

# Dogfood: glossary terms (under `## Core Concepts`) as addressable definitions,
# sourced from the reference glossary markdown. `jit item list --kind definition`.
[item_kinds.definition]
section = "core_concepts"
id-pattern = "[A-Z][a-z]+"
markers = []
link-namespaces = ["defines"]
scope = "project"
source = "docs/reference/glossary.md"
source-of-truth = "markdown-first"

# Dogfood: charter decisions as addressable items, sourced from the v1.0 vision
# charter. The kind scans the summary rows under `## Decision Log`
# (`- D-N: <one-liner>`), so `@/charter/D-N` resolves the one-line row; full
# entries live under `## Decision Details`, a `###`-heading section the kind does
# not scan. Reuses the `per` link namespace, so an issue carries `per:@/charter/D-N`
# (resolution is by qualified id, unambiguous alongside the issue-scope `decision`
# kind). `jit item list --kind charter`. The source is the charter of strategic
# anchor `9db27a3a`, kept under `dev/vision/` with this repository's other
# forward-looking vision documents.
[item_kinds.charter]
section = "decision_log"
id-pattern = "D-[0-9]+"
markers = []
link-namespaces = ["per"]
scope = "project"
source = "dev/vision/9db27a3a-charter.md"
source-of-truth = "markdown-first"

[invariant_projection]
# Region mode: replace only the delimited region inside CLAUDE.md (REQ-06).
# The markers <!-- jit:invariants:begin --> and <!-- jit:invariants:end --> wrap
# the id-anchor bullet list; `jit invariant render` keeps everything outside
# those markers byte-exact and writes atomically through storage.
# id-anchor style (REQ-08): heading-less `- **{id}** — {statement}` bullets, so
# the hand-authored "### Domain Invariants" heading above the markers stays put.
mode = "region"
target = "CLAUDE.md"
style = "id-anchor"

[rules_gates_projection]
# Region mode: replace only the delimited region inside the reference doc.
# The markers <!-- jit:rules-and-gates:begin --> and <!-- jit:rules-and-gates:end -->
# wrap the rendered `## Rules` / `## Gates` sections; `jit reference render` keeps
# everything outside those markers byte-exact and writes atomically through storage.
# full style: section headings + metadata bullets, addressed by the canonical
# kind-segmented forms @/rule/<name> and @/gate/<key>.
mode = "region"
target = "docs/reference/rules-and-gates.md"
style = "full"
