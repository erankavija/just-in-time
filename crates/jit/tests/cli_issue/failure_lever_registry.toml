argv = ["profile", "list", "--json"]
setup = ["init", "malformed-profile-record"]
setup_notes = "Create .jit/profiles/jit-dogfood.json with malformed JSON after initialization."
expected_failure = "PROFILE_CONFLICT because the installed profile record is malformed"
expected_code = "PROFILE_CONFLICT"
expected_exit = 4
confirmation = "invoked"

