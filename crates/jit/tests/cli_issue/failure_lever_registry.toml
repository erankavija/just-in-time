path = "profile show"
argv = ["profile", "show", "absent-profile", "--json"]
setup = ["init"]
expected_failure = "PROFILE_NOT_FOUND for a profile ID no location and no record supplies"
expected_code = "PROFILE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

