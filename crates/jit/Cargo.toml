[package]
name = "jit"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI-first issue tracker with dependency graphs and quality gates"
default-run = "jit"

[lib]
name = "jit"
path = "src/lib.rs"

[[bin]]
name = "jit"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
cap-std = "4.0.2"
cap-primitives = "4.0.2"
uuid = { workspace = true }
chrono = { workspace = true }
fs4 = { version = "0.13", features = ["sync"] }
git2 = "0.21"
which = "6.0"
similar = "2.6"
regex = "1.12.2"
# Local-only JSON Schema validation: repository schemas use same-document
# fragment refs (`#/types/...`), which the core validator resolves without any
# external retriever. Default features pull remote-resolution infrastructure
# (`resolve-http`/`resolve-file`/`tls-aws-lc-rs`, and transitively reqwest,
# hyper, and aws-lc-rs) that this crate never exercises (jit:3398bc19).
jsonschema = { version = "0.46", default-features = false }
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
tar = "0.4"
pulldown-cmark = { workspace = true }
# Remote document access (external-link reachability checks, commands::document)
# needs exactly one TLS backend (jit:3398bc19), and Rustls is the only reachable
# one: ureq's `Agent::new_with_defaults()` — the only call site — builds its
# `TlsConfig` from `TlsProvider::default()`, which is unconditionally Rustls, and
# ureq's native-tls provider docs state that choice "is never picked up
# automatically" (selecting it would take an explicit `.provider(...)` code
# change). Rustls needs no system TLS library: it shares the pure-Rust `ring`
# crypto backend pulled in via its own `_ring` feature, independent of the system
# OpenSSL that git2 links for its own purposes. `gzip` is named explicitly because
# content-decoding is a deliberate capability of the remote-document path, not an
# implicit default.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tempfile = { workspace = true }
dirs = "5.0"
nix = { version = "0.31.1", features = ["fs", "signal"] }
# Optional content-parser backends. Each is gated by its own feature and is OFF
# in the default build (see `[features]`), so the default `cargo build` neither
# compiles the parser modules nor pulls these crates.
tl = { version = "0.7", optional = true }
quick-xml = { version = "0.41", optional = true }

[features]
# HTML content parser (document/parser/html.rs). Pulls the pure-Rust `tl` HTML
# parser. OFF by default.
html = ["dep:tl"]
# XML content parser (document/parser/xml.rs). Pulls the `quick-xml` reader.
# OFF by default.
xml = ["dep:quick-xml"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
proptest = { workspace = true }
ulid = { workspace = true }
# Test-only local HTTPS server for the remote-document TLS/gzip coverage
# (jit:3398bc19 REQ-05): generates an ephemeral self-signed certificate so the
# test never touches the network. `rcgen` is trimmed to exactly its `ring`
# feature so certificate generation selects the crypto backend already present
# in the graph via ureq, never aws-lc-rs. `rustls`/`flate2` are already
# transitive dependencies of `ureq` (rustls, gzip features); declared directly
# here so the test can drive the server side of the same TLS/gzip capability
# the client uses.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = "1"
