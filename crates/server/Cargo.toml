[package]
name = "jit-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "REST API server for JIT issue tracker"

[lib]
name = "jit_server"
path = "src/lib.rs"

[[bin]]
name = "jit-server"
path = "src/main.rs"

[features]
default = ["embed-web"]
embed-web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
jit = { path = "../jit" }
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
notify = "8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
# Adopts a listening socket handed down by the launching `jit` process via the
# listenfd protocol, so the server never re-binds a port `jit` already probed
# (closes the cross-process probe-then-bind race). Contains the sole `unsafe`
# `FromRawFd` adoption this crate needs, keeping `#![deny(unsafe_code)]` intact.
listenfd = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.21"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
axum-test = "14.0"
tempfile = "3.8"
