[package]
name = "jit-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "REST API server for JIT issue tracker"

[lib]
name = "jit_server"
path = "src/lib.rs"

[[bin]]
name = "jit-server"
path = "src/main.rs"

[features]
default = ["embed-web"]
embed-web = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
jit = { path = "../jit" }
axum = "0.7"
# Owns listener and connection shutdown behind one `Handle`. `axum::serve`'s
# `with_graceful_shutdown` waits for open connections indefinitely; this crate's
# shutdown sequence starts `Handle::graceful_shutdown(None)`, then owns the sole
# timeout boundary and calls `Handle::shutdown()` if connections survive it.
# Default features only — no TLS backend is pulled in.
axum-server = "0.8"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# CancellationToken: the one shutdown signal shared by AppState, the router and
# the SSE streams, so an open event stream reaches EOF instead of being held
# open by its keepalive while the drain deadline runs down.
tokio-util = "0.7"
futures = "0.3"
notify = "8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
# Adopts a listening socket handed down by the launching `jit` process via the
# listenfd protocol, so the server never re-binds a port `jit` already probed
# (closes the cross-process probe-then-bind race). Contains the sole `unsafe`
# `FromRawFd` adoption this crate needs, keeping `#![deny(unsafe_code)]` intact.
listenfd = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.21"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
# Enables jit's test-support feature so this crate's own #[cfg(test)] modules
# can reach jit's failure-injection surface (e.g. TransactionFailureInjector)
# the same way the jit crate's own tests do.
jit = { path = "../jit", features = ["test-support"] }
axum-test = "14.0"
tempfile = "3.8"
# SIGTERM delivery for the real-process shutdown test. Same crate and feature
# the `jit` crate signals with, so both signalling paths share one guarded
# `i32::try_from` conversion discipline (`@/inv/pid-safety`).
nix = { version = "0.31.1", features = ["signal"] }
