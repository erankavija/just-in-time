# One service: `jit-server` serving the API and the built web UI on one port,
# against a whole repository bind-mounted at /repo.
#
# The mounted repository is initialized on the host (`jit init`) and the
# container serves it in place, so `.jit/` and the project documents linked from
# it keep their repository context.
#
# Point JIT_REPO at that repository and map the identity that owns it onto the
# container user:
#
#   JIT_REPO=/path/to/your/repo \
#   JIT_UID=$(stat -c '%u' /path/to/your/repo) \
#   JIT_GID=$(stat -c '%g' /path/to/your/repo) \
#   docker compose up -d
#
# Left unset, the service runs as the image default 10001:10001, which reaches
# the mount only when that identity may read, write, and search it.
# docs/how-to/deployment.md is the canonical account of this contract.

services:
  jit-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: jit-server:local
    user: "${JIT_UID:-10001}:${JIT_GID:-10001}"
    ports:
      - "${JIT_PORT:-3000}:3000"
    volumes:
      - ${JIT_REPO:-.}:/repo
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
