name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: ./check.sh
  audit:
    runs-on: ubuntu-latest
    steps:
      - run: ./audit.sh
  build:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - run: ./build.sh
  publish:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - run: ./publish.sh
