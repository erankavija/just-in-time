name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: ./check.sh
  publish:
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
      - run: ./publish.sh
  notify:
    runs-on: ubuntu-latest
    needs: [validate]
    if: success() || failure()
    steps:
      - run: ./notify.sh
