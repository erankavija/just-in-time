name: Release Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: ./one-quick-check.sh
  publish:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - run: ./publish.sh
