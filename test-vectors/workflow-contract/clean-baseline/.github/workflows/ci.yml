name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate
        run: ./check.sh
  publish:
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: ./.github/actions/publish
