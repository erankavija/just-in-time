schema = "failure-lever-registry/v1"
namespace = "issue"

[[arms]]
path = "issue create"
argv = ["issue", "create", "--title", "probe", "--priority", "impossible", "--json"]
setup = ["init"]
expected_failure = "Priority parsing rejects `impossible` after the create arm has dispatched."
expected_code = "INVALID_ARGUMENT"
expected_exit = 2
confirmation = "invoked"

[[arms]]
path = "issue batch-create"
argv = ["issue", "batch-create", "--from-json", "missing-batch.json", "--json"]
setup = ["init", "file-absent:missing-batch.json"]
expected_failure = "The batch-create arm cannot read the named batch file."
expected_code = "REPOSITORY_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "issue search"
argv = ["issue", "search", "--json"]
setup = ["init"]
expected_failure = "The search arm rejects an invocation with neither a query nor a filter."
expected_code = "INVALID_ARGUMENT"
expected_exit = 2
confirmation = "invoked"

[[arms]]
path = "issue show"
argv = ["issue", "show", "deadbeef", "--json"]
setup = ["init", "no-issue:deadbeef"]
expected_failure = "Issue resolution reports that `deadbeef` is not found."
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

