setup = ["worktree:primary", "init", "env-unset:JIT_ALLOW_DELETION"]
expected_failure = "The delete arm refuses deletion without explicit confirmation."
expected_code = "DELETION_NOT_CONFIRMED"
expected_exit = 2
confirmation = "invoked"

