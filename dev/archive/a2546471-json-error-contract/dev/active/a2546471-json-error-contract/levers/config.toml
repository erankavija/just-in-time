schema = "failure-lever-registry/v1"
namespace = "config"

[[arms]]
path = "config show"
argv = ["config", "show", "--json"]
setup = ["init", "malformed-config-toml"]
setup_notes = "Replace the [version] table header in .jit/config.toml with the malformed `[version` after initialization."
expected_failure = "Failed to parse config.toml"
expected_code = "PARSE_ERROR"
expected_exit = 1
confirmation = "invoked"

[[arms]]
path = "config get"
argv = ["config", "get", "version.unknown", "--json"]
setup = ["init"]
expected_failure = "INVALID_ARGUMENT: unknown config key 'version.unknown': no 'unknown' under 'version'"
expected_code = "INVALID_ARGUMENT"
expected_exit = 2
confirmation = "invoked"

[[arms]]
path = "config set"
argv = ["config", "set", "validation.strictness", "banana", "--json"]
setup = ["init"]
expected_failure = "invalid [validation].strictness in .jit/config.toml: 'banana' (expected strict, loose, or permissive)"
expected_code = "INVALID_ARGUMENT"
expected_exit = 2
confirmation = "invoked"

[[arms]]
path = "config validate"
argv = ["config", "validate", "--json"]
setup = ["init", "env:JIT_WORKTREE_MODE=definitely-not-a-mode"]
setup_notes = "Set JIT_WORKTREE_MODE to an invalid value after initialization so validation reaches a reproducible post-dispatch finding."
expected_failure = "Validation failed: 1 error(s)"
expected_code = "VALIDATION_FAILED"
expected_exit = 4
confirmation = "invoked"

[[arms]]
path = "config show-hierarchy"
argv = ["config", "show-hierarchy", "--json"]
setup = ["init", "malformed-config-toml"]
setup_notes = "Replace the [version] table header in .jit/config.toml with the malformed `[version` after initialization."
expected_failure = "Failed to parse config.toml"
expected_code = "PARSE_ERROR"
expected_exit = 1
confirmation = "invoked"

[[arms]]
path = "config list-templates"
exemption_reason = "The arm only enumerates the built-in HierarchyTemplate::all() collection and serializes it; source inspection finds no repository input or fallible command-body operation that can produce a post-dispatch failure."
confirmation = "source-only"
