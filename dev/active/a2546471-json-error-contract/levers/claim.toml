schema = "failure-lever-registry/v1"
namespace = "claim"

[[arms]]
path = "claim acquire"
argv = ["claim", "acquire", "deadbeef", "--agent-id", "agent:probe", "--json"]
setup = ["init", "no-issue:deadbeef"]
expected_failure = "ISSUE_NOT_FOUND: Issue not found: deadbeef"
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "claim release"
argv = ["claim", "release", "deadbeef", "--json"]
setup = ["init", "no-issue:deadbeef"]
expected_failure = "ISSUE_NOT_FOUND: Failed to resolve issue id deadbeef"
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "claim renew"
argv = ["claim", "renew", "00000000-0000-0000-0000-000000000000", "--json"]
setup = ["init", "git:repository-with-head", "env:JIT_AGENT_ID=agent:probe", "claim:index-with-active-lease"]
setup_notes = "claim:index-with-active-lease seeds one valid issue and acquires a finite lease for it, creating .git/jit/claims.index.json and its locks before the missing lease lookup."
expected_failure = "ISSUE_NOT_FOUND: Lease 00000000-0000-0000-0000-000000000000 not found"
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "claim heartbeat"
argv = ["claim", "heartbeat", "00000000-0000-0000-0000-000000000000", "--json"]
setup = ["init", "git:repository-with-head", "env:JIT_AGENT_ID=agent:probe", "claim:index-with-active-lease"]
setup_notes = "claim:index-with-active-lease seeds one valid issue and acquires a finite lease for it, creating .git/jit/claims.index.json and its locks before the missing lease lookup."
expected_failure = "ISSUE_NOT_FOUND: Lease 00000000-0000-0000-0000-000000000000 not found"
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "claim status"
argv = ["claim", "status", "--json"]
setup = ["init", "git:repository-with-head", "env:JIT_AGENT_ID=agent:probe", "claim:index-with-active-lease", "malformed-claim-index"]
setup_notes = "malformed-claim-index replaces .git/jit/claims.index.json with invalid JSON after claim:index-with-active-lease has created it."
expected_failure = "PARSE_ERROR: Failed to parse claims index"
expected_code = "PARSE_ERROR"
expected_exit = 1
confirmation = "invoked"

[[arms]]
path = "claim list"
argv = ["claim", "list", "--json"]
setup = ["init", "git:repository-with-head", "claim:index-with-active-lease", "malformed-claim-index"]
setup_notes = "malformed-claim-index replaces .git/jit/claims.index.json with invalid JSON after claim:index-with-active-lease has created it."
expected_failure = "PARSE_ERROR: Failed to parse claims index"
expected_code = "PARSE_ERROR"
expected_exit = 1
confirmation = "invoked"

[[arms]]
path = "claim force-evict"
argv = ["claim", "force-evict", "00000000-0000-0000-0000-000000000000", "--reason", "probe", "--json"]
setup = ["init", "git:repository-with-head", "claim:index-with-active-lease"]
setup_notes = "claim:index-with-active-lease seeds one valid issue and acquires a finite lease for it, creating .git/jit/claims.index.json and its locks before the missing lease lookup."
expected_failure = "ISSUE_NOT_FOUND: Lease 00000000-0000-0000-0000-000000000000 not found"
expected_code = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"
