schema = "failure-lever-registry/v1"
namespace = "profile"

[[arms]]
path = "profile list"
argv = ["profile", "list", "--json"]
setup = ["init", "malformed-profile-record"]
setup_notes = "Create .jit/profiles/jit-dogfood.json with malformed JSON after initialization."
expected_failure = "PROFILE_CONFLICT because the installed profile record is malformed"
expected_exit = 4
confirmation = "invoked"

[[arms]]
path = "profile show"
argv = ["profile", "show", "absent-profile", "--json"]
setup = ["init"]
expected_failure = "PROFILE_NOT_FOUND for an unknown embedded profile ID"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "profile apply"
argv = ["profile", "apply", "absent-profile", "--json"]
setup = ["init"]
expected_failure = "PROFILE_NOT_FOUND for an unknown embedded profile ID"
expected_exit = 3
confirmation = "invoked"
