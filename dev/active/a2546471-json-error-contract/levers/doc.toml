schema = "failure-lever-registry/v1"
namespace = "doc"

[[arms]]
path = "doc add"
argv = ["doc", "add", "deadbeef", ".jit/config.toml", "--json"]
setup = ["initialized-repository"]
expected_failure = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "doc assets list"
argv = ["doc", "assets", "list", "deadbeef", ".jit/config.toml", "--json"]
setup = ["initialized-repository"]
expected_failure = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "doc check-links"
argv = ["doc", "check-links", "--scope", "issue:deadbeef", "--json"]
setup = ["initialized-repository"]
expected_failure = "ISSUE_NOT_FOUND"
expected_exit = 3
confirmation = "invoked"

[[arms]]
path = "doc conformance"
argv = ["doc", "conformance", "--json"]
setup = ["initialized-repository", "malformed-config-toml"]
expected_failure = "PARSE_ERROR"
expected_exit = 1
confirmation = "invoked"
setup_notes = "Replace the [version] table header in .jit/config.toml with the malformed `[version` before invoking."

[[arms]]
path = "doc diff"
argv = ["doc", "diff", "deadbeef", ".jit/config.toml", "--from", "HEAD", "--json"]
