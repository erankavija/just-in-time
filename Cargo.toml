[workspace]
members = ["crates/jit", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["erankavija"]

[profile.dev]
# Line-number backtraces without the full debugger payload (type info, macro
# expansions) that dominated a representative test executable's size (jit:57d0eb79;
# that measurement's provenance, and the executable-bytes budget this profile
# keeps the tree inside, are in dev/benchmarks/rust-build-budgets/README.md).
# `incremental` is stated explicitly so ordinary interactive builds keep
# Cargo's default rather than depend on an undocumented one;
# scripts/cargo-ci.sh overrides it with CARGO_INCREMENTAL=0 for gate runs,
# where accumulated incremental state has no interactive rebuild to amortize
# against.
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

# Dependencies are compiled once and then run by every test process, so their
# unoptimized code is pure repeated cost: the suite's own CPU profile is spread
# across SHA-256 over whole build artifacts, TOML parsing, and JSON
# serialization, none of which is workspace code. Optimizing the dependency
# graph alone leaves workspace crates at the debug profile's compile times and
# its `debug-assertions`/`overflow-checks`, which package overrides do not
# change (jit:6d10e5d4).
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["chrono"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
ulid = "1.1"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.13.3"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"
