# JIT Configuration File (Schema v2)
#
# Place this file at `.jit/config.toml` to customize JIT behavior.
# Every table is optional, and each one declares a vocabulary the engine reads
# back: what a table omits, the repository does not have. Applying a profile
# package writes the tables it carries into this file.

[version]
# Schema version - required for new features
schema = 2

# =============================================================================
# DOCUMENTATION LIFECYCLE
# =============================================================================
# Configure how JIT manages development documentation (design docs, session notes).
# Applying the `jit-default` profile package writes this whole table from that
# package's development-area classification, so author it only to reclassify.
# The classification, what each key means, how its entries are matched, and what
# an absent key resolves to: docs/reference/configuration.md, section
# `[documentation]`.

# jit:shipped-documentation-policy:begin
[documentation]
development_root = "dev"
archive_root = "dev/archive"
managed_paths = ["dev/active", "dev/studies", "dev/sessions", "dev/plans", "dev/presentations", "dev/design", "dev/benchmarks", "dev/experiments"]
permanent_paths = ["dev/architecture", "dev/eval", "dev/vision", "dev/index.md", "dev/TESTING.md", "dev/authoring-conventions.md"]
issue_scoped_areas = ["dev/active", "dev/studies", "dev/plans", "dev/presentations"]
# jit:shipped-documentation-policy:end

# =============================================================================
# TYPE HIERARCHY
# =============================================================================
# Define issue types and their strategic importance

[type_hierarchy]
# Type name to hierarchy level mapping (lower numbers = more strategic).
# The four levels below are the ones the `jit-default` package declares; a
# repository with no `[type_hierarchy]` table has no types at all.
types = { milestone = 1, epic = 2, story = 3, task = 4 }

# Types shown in 'jit query strategic' (high-level planning view)
strategic_types = ["milestone", "epic"]

# Type → membership label namespace mapping
# Example: issues with type:epic use "epic:name" labels to group children
[type_hierarchy.label_associations]
milestone = "milestone"
epic = "epic"
story = "story"

# Hierarchy type icons for visual identification (web UI)
# Icons are assigned by hierarchy level (domain-agnostic)
[type_hierarchy.icons]
# Example: per-type overrides (level defaults apply to other types)
# [type_hierarchy.icons.custom]
# milestone = "🎯"
# epic = "📚"
# story = "📄"
# task = "✓"

# =============================================================================
# VALIDATION
# =============================================================================
# Issue-creation defaults plus the repo-wide enforcement modulator; rules.toml
# defines the individual rules.

[validation]
# Repo-wide enforcement strictness, layered on top of each rule's enforce/severity
# (it never changes them — only the block/allow decision):
#   strict      — any violation blocks (warning or error, enforced or not)
#   loose       — only an enforced error blocks; warnings are advisory (default)
#   permissive  — nothing blocks; every violation is report-only
# An unrecognized value is rejected. Absent means "loose".
strictness = "loose"

# Auto-assign this type when creating issues without a type:* label
default_type = "task"

# Repo-level default content format for issue description bodies. Selects the
# parser used to extract `sections` during validation for issues that carry no
# per-issue `content_format`. One of: "markdown" (default), "html", "xml".
# Note: "html"/"xml" require the binary to be built with the matching cargo
# feature; selecting an uncompiled format produces a clear error, never a silent
# Markdown fallback.
content_format = "markdown"

# NOTE: individual label/type rules (format, namespace registry, and
# per-namespace uniqueness) are defined declaratively in `.jit/rules.toml`,
# scaffolded by `jit init`. The workflow profile contributes the orphan-leaf /
# strategic-consistency warnings. The scaffolded `origin = "default"` rules
# derive their assertion — and their membership — from
# the `[namespaces]` / `[type_hierarchy]` registry above, in
# memory at load; the `schemas/default-*.json` files are regenerated projections,
# not the authority. jit-driven writes to this file (config set, re-init) also
# sync the default rows in rules.toml to the registry. Every default rule but the
# label grammar comes from one of those two tables, so declaring neither leaves
# `label-format` alone. `strictness` above tunes how the rules gate operations
# globally.

# =============================================================================
# NAMESPACE REGISTRY
# =============================================================================
# Declare label namespaces (taxonomy only). Each namespace supports:
#   description — human-readable purpose (required)
#   unique      — at most one label from this namespace per issue (required)
#   examples    — documentation only, not enforced
# Allowed-value enums, value patterns, and required-ness are NOT configured here:
# author them as custom rules in `.jit/rules.toml`. (The built-in default rules
# for the registry and uniqueness derive from this table at load, and are
# written only while it declares something.)

[namespaces.type]
description = "Issue type taxonomy (hierarchical)"
unique = true
examples = ["type:task", "type:story", "type:epic", "type:milestone"]

[namespaces.epic]
description = "Epic membership - which epic does this issue belong to?"
unique = false
examples = ["epic:auth", "epic:production-stability"]

[namespaces.milestone]
description = "Milestone membership - target release or time period"
unique = false
examples = ["milestone:v1.0", "milestone:2026-q1"]

[namespaces.story]
description = "Story membership - parent story for tasks"
unique = false
examples = ["story:user-login", "story:checkout-flow"]

[namespaces.component]
description = "Technical component or subsystem affected"
unique = false
examples = ["component:api", "component:web", "component:cli"]

[namespaces.team]
description = "Owning team"
unique = true
examples = ["team:core", "team:platform"]

[namespaces.resolution]
description = "Reason for issue closure (used with rejected state)"
unique = true
examples = ["resolution:wont-fix", "resolution:duplicate", "resolution:obsolete"]

# Documentation projections (optional). Each `[projection.<name>]` table makes
# `jit project render` write one or more addressable item kinds into a doc file,
# keeping the rendered copy in sync with the kind's declared source of truth
# (a TOML registry, or a markdown document for a markdown-first kind). Fields:
#   kind   — a kind name, or an array (must be project-scoped)
#   mode   — "region" (rewrite only the delimited block, preserving the rest) or
#            "separate-file" (write the whole file); defaults to "separate-file"
#   target — REQUIRED repo-relative path (no default)
#   style  — "id-anchor" (generic `- **{id}** — {text}` bullets, any
#            project-scoped kind) or "full" (built-in rich views, ONLY for the
#            invariant store or the rule + gate stores together); defaults to
#            "full"
#   region-begin / region-end — region markers; default to
#            "<!-- jit:<name>:begin -->" / "<!-- jit:<name>:end -->"
# [projection.invariants]
# kind = "invariant"
# mode = "region"
# target = "AGENTS.md"
# style = "id-anchor"
#
# [projection.rules-and-gates]
# kind = ["rule", "gate"]
# mode = "separate-file"
# target = "docs/reference/rules-and-gates.md"
# style = "full"

# =============================================================================
# EXAMPLES: Alternative Configurations
# =============================================================================

# Minimal 2-level hierarchy (simple projects):
# [type_hierarchy]
# types = { epic = 1, task = 2 }
# strategic_types = ["epic"]
# [type_hierarchy.label_associations]
# epic = "epic"

# Extended 5-level hierarchy (large organizations):
# [type_hierarchy]
# types = { program = 1, milestone = 2, epic = 3, story = 4, task = 5 }
# strategic_types = ["program", "milestone", "epic"]
# [type_hierarchy.label_associations]
# program = "program"
# milestone = "milestone"
# epic = "epic"
# story = "story"

# Research project configuration:
# [type_hierarchy]
# types = { program = 1, study = 2, experiment = 3, analysis = 4 }
# strategic_types = ["program", "study"]
# [namespaces.dataset]
# description = "Dataset being analyzed"
# unique = false
# examples = ["dataset:census-2024", "dataset:survey-q1"]
