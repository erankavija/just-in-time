# Example ruleset: Nyquist criteria check labels
#
# Every [hard] criterion in an epic's success criteria must have a check label
# in the form checks:<own-short-id>/<criterion-id>.
#
# Engine kind used:
#   criteria-to-check  (graph) verifies that each selected criterion has its
#                       issue-scoped check label.
#
# The name "Nyquist" is a team convention, NOT a built-in engine concept.
# The engine ships the generic `criteria-to-check` primitive; the methodology
# lives entirely in this file. To adapt: change the marker, id pattern, or
# check namespace to match your team's conventions.
#
# How it works in practice:
#
#   1. Author an epic with a "## Success Criteria" section. Each [hard] item
#      must carry a stable id, e.g.:
#
#        ## Success Criteria
#        - [hard] REQ-01: the parser rejects invalid input
#        - [hard] REQ-02: all edge cases are covered by tests
#        - [aspirational] REQ-03: performance meets the latency target
#
#   2. Add one check label per [hard] criterion:
#      "checks:<epic-short-id>/REQ-01" and "checks:<epic-short-id>/REQ-02".
#
#   3. `jit validate` reports any [hard] criterion without its check label.
#      The always-on variant fires during planning; the done-scoped
#      enforce=true variant blocks the transition to done.
#
# Rule structure:
#   nyquist-criteria-have-checks (always-on, warn)
#     Reports criteria without check labels at any lifecycle stage.
#
#   nyquist-criteria-checked-at-done (done-scoped, error, enforce=true)
#     Blocks the transition to done until every [hard] criterion has a
#     check label. With enforce=true, `jit issue update --state done` exits 4
#     and names the unmapped criteria; `--force` bypasses the block (recorded
#     as a graph-rule-bypassed event in the audit log).
#
# To adapt this ruleset for your project:
#   - Change `marker` (or remove it to require checks for ALL criteria items).
#   - Change `id-pattern` if your criterion ids use a different format.
#   - Change `check-namespace` to the namespace used by your check labels.

# Always-on: warn during planning so authors can catch missing check labels
# early. Fires at any lifecycle state.
[[rules]]
name = "nyquist-criteria-have-checks"
when = { type = "epic" }
severity = "warn"
enforce = false
assert = { criteria-to-check = { marker = "[hard]", check-namespace = "checks" } }

# Transition guard: block done until every [hard] criterion has its check label.
# `enforce = true` causes `jit issue update --state done` to exit 4 while any
# [hard] criterion lacks a check label. The finding names the criterion id and
# expected label so the author knows exactly which check to add.
[[rules]]
name = "nyquist-criteria-checked-at-done"
when = { type = "epic", state = "done" }
severity = "error"
enforce = true
assert = { criteria-to-check = { marker = "[hard]", check-namespace = "checks" } }
