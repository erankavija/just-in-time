[profile]
manifest-version = 1
id = "jit-dogfood"
version = "1.0.0"
jit = ">=0.2.1, <0.3.0"

# Repository-neutral workflow taxonomy. The four ordinary hierarchy entries
# are shared with neutral `jit init`; the profile adds bracket and task
# specialization without changing the engine's vocabulary.
[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "milestone"
value = 1

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "epic"
value = 2

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "story"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "planning"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "breakdown"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "task"
value = 4

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "bug"
value = 4

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "enhancement"
value = 4

[[contribution]]
kind = "map-entry"
target = "label-associations"
identity = "milestone"
value = "milestone"

[[contribution]]
kind = "map-entry"
target = "label-associations"
identity = "epic"
value = "epic"

[[contribution]]
kind = "map-entry"
target = "label-associations"
identity = "story"
value = "story"

[[contribution]]
kind = "set-string"
target = "strategic-types"
value = "milestone"

[[contribution]]
kind = "set-string"
target = "strategic-types"
value = "epic"

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "epic"
value = { description = "Feature or initiative membership.", unique = false, examples = ["epic:user-auth", "epic:release-readiness"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "story"
value = { description = "Story membership.", unique = false, examples = ["story:login-flow", "story:release-validation"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "brackets"
value = { description = "Planning-bracket container pointer.", unique = true, examples = ["brackets:0123abcd"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "satisfies"
value = { description = "Coverage credit for a container success criterion.", unique = false, examples = ["satisfies:REQ-01"] }

# Advisory authoring structure plus enforced plan-time and completion coverage.
[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "jit-content-standards"

[contribution.value]
name = "jit-content-standards"
origin = "jit-dogfood"
description = "Warn when an issue lacks marked, stable success criteria."
severity = "warn"
enforce = false
assert = { json-schema = "schemas/jit-content-standards.json" }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "hard-criteria-covered"

[contribution.value]
name = "hard-criteria-covered"
origin = "jit-dogfood"
description = "Before an epic completes, every hard requirement is credited to a completed implementation descendant."
when = { type = "epic", state = "done" }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", child-state = "done", child-link = "dependencies", child-type-exclude = ["planning", "breakdown"] } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "coverage-preview"

[contribution.value]
name = "coverage-preview"
origin = "jit-dogfood"
description = "While breakdown is reviewed, every hard requirement is credited to a drafted implementation descendant."
when = { type = "breakdown", state = ["in_progress", "gated", "done"] }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", container-from-label = "brackets", child-link = "dependencies", child-type-exclude = ["planning", "breakdown"] } }

# Review gates begin as unmistakable structured-warning placeholders. Adopters
# can replace each checker independently without changing the workflow graph.
[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "plan-review"

[contribution.value]
version = 1
key = "plan-review"
title = "Plan Review"
description = "External-review placeholder for the linked plan before implementation work fans out."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "breakdown-review"

[contribution.value]
version = 1
key = "breakdown-review"
title = "Breakdown Review"
description = "External-review placeholder for decomposition quality, issue content, and dependency ordering before implementation."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "code-review"

[contribution.value]
version = 1
key = "code-review"
title = "Code Review"
description = "Review issue-attributable implementation changes against repository policy and success criteria."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "coverage-preview"

[contribution.value]
version = 1
key = "coverage-preview"
title = "Coverage Preview"
description = "Validate the container named by the breakdown issue's brackets label."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "label_target_validation"
label_namespace = "brackets"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "jit-validate"

[contribution.value]
version = 1
key = "jit-validate"
title = "Issue Validation"
description = "Run declarative validation for the gated issue."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "issue_validation"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "repo-validate"

[contribution.value]
version = 1
key = "repo-validate"
title = "Repository Validation"
description = "Run structural and declarative validation for the whole repository."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "repository_validation"

# Epic-only plan-before-fan-out bracket. Built-in compatibility presets derive
# their node gate definitions from this template and the gate contributions.
[[contribution]]
kind = "keyed-array"
target = "templates"
identity = "plan"

[contribution.value]
name = "plan"
description = "Plan-before-fan-out bracket with planning and breakdown review."
applies_to = ["epic"]

[[contribution.value.anchors]]
name = "container"
gates = ["repo-validate"]

[[contribution.value.nodes]]
role = "planning"
type = "planning"
gates = ["plan-review"]
doc_area = "dev/active"
doc = "{container.dir}/plan.md"
description = "Plan {container.title} ({container.short_id}) against every hard success criterion, write the concise design at {doc} and its authoritative sibling breakdown manifest, and link both to this planning issue."

[[contribution.value.nodes]]
role = "breakdown"
type = "breakdown"
gates = ["coverage-preview", "breakdown-review"]
labels = ["brackets:{container.short_id}"]
description = "After the plan-review checkpoint passes, decompose the plan for {container.title} ({container.short_id}) into well-ordered implementation issues."
depends_on = ["planning"]

[[contribution.value.anchor_edges]]
from = "container"
to = "breakdown"

[[contribution.value.transforms]]
kind = "move-upstream-to-role"
role = "planning"

[[contribution]]
kind = "projection"
name = "invariants"
value = { kind = "invariant", mode = "region", target = "AGENTS.md", style = "id-anchor" }

[[contribution]]
kind = "projection"
name = "rules-and-gates"
value = { kind = ["rule", "gate"], mode = "separate-file", target = ".jit/reference/rules-and-gates.md", style = "full" }

# Install-only adopter state.
[[asset]]
source = "assets/install/.jit/invariants.toml"
target = ".jit/invariants.toml"

[[asset]]
source = "assets/install/.jit/schemas/jit-content-standards.json"
target = ".jit/schemas/jit-content-standards.json"

[[asset]]
source = "assets/install/.jit/reference/rules-and-gates.md"
target = ".jit/reference/rules-and-gates.md"

