dependencies = ["jit-default"]

[profile]
manifest-version = 1
id = "jit-dogfood"
version = "1.0.0"
jit = ">=1.0.0, <2.0.0"

# Repository-neutral workflow taxonomy. `jit-default` supplies the shared
# hierarchy and vocabulary; this profile adds bracket and task specialization.

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "planning"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "breakdown"
value = 3

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "bug"
value = 4

[[contribution]]
kind = "map-entry"
target = "type-hierarchy-types"
identity = "enhancement"
value = 4

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "epic"
value = { description = "Feature or initiative membership.", unique = false, examples = ["epic:user-auth", "epic:release-readiness"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "story"
value = { description = "Story membership.", unique = false, examples = ["story:login-flow", "story:release-validation"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "brackets"
value = { description = "Planning-bracket container pointer.", unique = true, examples = ["brackets:0123abcd"] }

[[contribution]]
kind = "map-entry"
target = "namespaces"
identity = "satisfies"
value = { description = "Coverage credit: on an impl child, names a container [hard] criterion id this child CONTRIBUTES to. Several children may credit one id; the label denotes contribution, not sole delivery. Read by the label-coverage gate, which credits a criterion when any labelled child exists.", unique = false, examples = ["satisfies:REQ-01"] }

# Advisory authoring structure plus enforced plan-time and completion coverage.
[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "jit-content-standards"

[contribution.value]
name = "jit-content-standards"
origin = "jit-dogfood"
description = "Warn when an issue lacks marked, stable success criteria."
severity = "warn"
enforce = false
assert = { json-schema = "schemas/jit-content-standards.json" }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "hard-criteria-covered"

[contribution.value]
name = "hard-criteria-covered"
origin = "jit-dogfood"
description = "Before an epic completes, every hard requirement is credited to a completed implementation descendant."
when = { type = "epic", state = "done" }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", child-state = "done", child-link = "dependencies", child-type-exclude = ["planning", "breakdown"] } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "coverage-preview"

[contribution.value]
name = "coverage-preview"
origin = "jit-dogfood"
description = "While breakdown is reviewed, every hard requirement is credited to a drafted implementation descendant."
when = { type = "breakdown", state = ["in_progress", "gated", "done"] }
severity = "error"
enforce = true
assert = { label-coverage = { criteria-section = "success_criteria", marker = "[hard]", id-pattern = "REQ-[0-9]+", satisfies-namespace = "satisfies", container-from-label = "brackets", child-link = "dependencies", child-type-exclude = ["planning", "breakdown"] } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "orphan-leaf"

[contribution.value]
name = "orphan-leaf"
origin = "jit-dogfood"
description = "Warn when a leaf-level-typed issue carries no parent-membership label, leaving it unattached to any strategic container. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "orphan-leaf" } }

[[contribution]]
kind = "keyed-array"
target = "rules"
identity = "strategic-consistency"

[contribution.value]
name = "strategic-consistency"
origin = "jit-dogfood"
description = "Warn when a strategic-typed issue lacks its own identifying membership label. Advisory: never blocks a write."
severity = "warn"
enforce = false
assert = { type-hierarchy = { kind = "strategic-consistency" } }

# Review gates begin as unmistakable structured-warning placeholders. Adopters
# can replace each checker independently without changing the workflow graph.
[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "plan-review"

[contribution.value]
version = 1
key = "plan-review"
title = "Plan Review"
description = "External-review placeholder for the linked plan before implementation work fans out."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "breakdown-review"

[contribution.value]
version = 1
key = "breakdown-review"
title = "Breakdown Review"
description = "External-review placeholder for decomposition quality, issue content, and dependency ordering before implementation."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "code-review"

[contribution.value]
version = 1
key = "code-review"
title = "Code Review"
description = "Review issue-attributable implementation changes against repository policy and success criteria."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "review_placeholder"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "coverage-preview"

[contribution.value]
version = 1
key = "coverage-preview"
title = "Coverage Preview"
description = "Validate the container named by the breakdown issue's brackets label."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "label_target_validation"
label_namespace = "brackets"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "jit-validate"

[contribution.value]
version = 1
key = "jit-validate"
title = "Issue Validation"
description = "Run declarative validation for the gated issue."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "issue_validation"

[[contribution]]
kind = "keyed-array"
target = "gates"
identity = "repo-validate"

[contribution.value]
version = 1
key = "repo-validate"
title = "Repository Validation"
description = "Run structural and declarative validation for the whole repository."
stage = "postcheck"
mode = "auto"
priority = 100
auto = true
reserved = {}

[contribution.value.checker]
type = "repository_validation"

# Epic-only plan-before-fan-out bracket. Built-in compatibility presets derive
# their node gate definitions from this template and the gate contributions.
[[contribution]]
kind = "keyed-array"
target = "templates"
identity = "plan"

[contribution.value]
name = "plan"
description = "Plan-before-fan-out bracket with planning and breakdown review."
applies_to = ["epic"]

[[contribution.value.anchors]]
name = "container"
gates = ["repo-validate"]

[[contribution.value.nodes]]
role = "planning"
type = "planning"
gates = ["plan-review"]
doc_area = "dev/active"
doc = "{container.dir}/plan.md"
description = "Plan {container.title} ({container.short_id}) against every hard success criterion, write the concise design at {doc} and its authoritative sibling breakdown manifest, and link both to this planning issue."

[[contribution.value.nodes]]
role = "breakdown"
type = "breakdown"
gates = ["coverage-preview", "breakdown-review"]
labels = ["brackets:{container.short_id}"]
description = "After the plan-review checkpoint passes, decompose the plan for {container.title} ({container.short_id}) into well-ordered implementation issues."
depends_on = ["planning"]

[[contribution.value.anchor_edges]]
from = "container"
to = "breakdown"

[[contribution.value.transforms]]
kind = "move-upstream-to-role"
role = "planning"

# The workflow's repository invariants are contributions to the registry that
# initialization creates. The package never publishes that registry file.
# The checkout-only `cargo-ci` gate is not package content, so its generic
# enforcement claims bind to the package's portable `repo-validate` gate.
[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "label-format"

[contribution.value]
id = "label-format"
statement = "Every label is namespace:value (namespace lowercase-kebab, value non-empty)."
kind = "enforced"
enforced-by = "@/rule/label-format"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "namespace-registry"

[contribution.value]
id = "namespace-registry"
statement = "Every label namespace is declared in the namespace registry."
kind = "enforced"
enforced-by = "@/rule/namespace-registry"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "dag-acyclic"

[contribution.value]
id = "dag-acyclic"
statement = "Cycle detection runs before every dependency operation; the graph stays acyclic."
kind = "enforced"
enforced-by = "@/gate/repo-validate"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "gate-semantics"

[contribution.value]
id = "gate-semantics"
statement = "An issue cannot reach Done with pending or failed gates; unpassed gates divert completion to Gated."
kind = "enforced"
enforced-by = "@/gate/repo-validate"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "event-log"

[contribution.value]
id = "event-log"
statement = "Every state change appends an event to events.jsonl."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "atomic-writes"

[contribution.value]
id = "atomic-writes"
statement = "All file replacements use the temp-file + atomic-rename pattern; new-file publication uses verified staging plus atomic no-replace publication, so an occupied destination is never overwritten."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "derived-state-coherence"

[contribution.value]
id = "derived-state-coherence"
statement = "Every semantic mutation derives its coupled materializations from one final repository view and publishes the resulting state recoverably."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "pid-safety"

[contribution.value]
id = "pid-safety"
statement = "Process-signaling code rejects sentinel or lossy PID conversions before invoking the operating system, including the `u32::MAX as i32 == -1` case that would turn a targeted signal into `kill(-1, sig)`."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "assignee-format"

[contribution.value]
id = "assignee-format"
statement = "Every assignee is {type}:{identifier} (e.g. agent:worker-1, human:alice)."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "domain-agnostic"

[contribution.value]
id = "domain-agnostic"
statement = "Engine logic is domain-agnostic: type names, label vocabularies, gate keys, templates, and workflow shapes come from repository configuration (.jit/), never from hardcoded domain assumptions. The one sanctioned exception is the planning-bracket preset trio (plan-review, coverage-preview, breakdown-review): it encodes jit's own plan-before-fan-out workflow (@/charter/D-3), not an adopter domain, so it is retained as the single binary-shipped preset bundle."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "single-source-prose"

[contribution.value]
id = "single-source-prose"
statement = "Every fact with a single source of truth reaches prose by projection or citation; volatile facts (counts, enumerations, registry contents) are stated structurally or derived, and a hand-maintained copy is a staleness defect."
kind = "enforced"
enforced-by = "@/gate/code-review"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "semantic-test-assertions"

[contribution.value]
id = "semantic-test-assertions"
statement = "Tests assert observable semantic properties or relationships; exact field-name inventories and literal-value assertions are confined to one canonical suite for an intentionally stable external contract."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "shared-test-contracts"

[contribution.value]
id = "shared-test-contracts"
statement = "Frequently repeated setup and interface behavior use shared fixtures and conformance suites; every implementation of an interface runs the same behavioral contract, while implementation-specific tests cover only implementation-specific behavior."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "bounded-rust-build-footprint"

[contribution.value]
id = "bounded-rust-build-footprint"
statement = "Rust test topology stays bounded to a small number of cohesive suites rather than one Cargo target per test file, build profiles stay compact rather than embedding a full debugger payload in every test executable, dependency features stay intentional rather than pulling in unused remote-resolution or duplicate TLS infrastructure, and integration-test target count and active test-executable bytes remain within automatically enforced budgets."
kind = "enforced"
enforced-by = "@/gate/repo-validate"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "semantic-types"

[contribution.value]
id = "semantic-types"
statement = "Every identity, constrained token, closed vocabulary, and protocol sentinel has one canonical semantic type; raw strings exist only at parsing and serialization boundaries."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "canonical-cutover"

[contribution.value]
id = "canonical-cutover"
statement = "Superseded aliases, fields, and representations are removed after cutover; compatibility code is allowed only in a named, versioned migration boundary with a tracked removal condition."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "architecture-dependency-direction"

[contribution.value]
id = "architecture-dependency-direction"
statement = "Dependencies point inward: domain and graph remain pure and I/O-free; storage owns persistence; commands orchestrate domain and storage; CLI, output, and server layers adapt inputs and outputs without pushing their concerns into inner layers."
kind = "advisory"

[[contribution]]
kind = "keyed-array"
target = "invariants"
identity = "convention-convergence"

[contribution.value]
id = "convention-convergence"
statement = "A shared convention or abstraction has one form: work that finds it harmful or ill-fitting changes it at its source, or reports the mismatch as a blocking concern before proceeding. A local parallel variant, a private helper duplicating a shared mechanism, or a bypass around an abstraction is a defect unless it is a named, cited exception with a tracked convergence condition."
kind = "advisory"

[[contribution]]
kind = "projection"
name = "invariants"
value = { kind = "invariant", mode = "region", target = "AGENTS.md", style = "id-anchor" }

[[contribution]]
kind = "projection"
name = "rules-and-gates"
value = { kind = ["rule", "gate"], mode = "separate-file", target = ".jit/reference/rules-and-gates.md", style = "full" }

# Install-only adopter state. The invariant registry is not among it:
# initialization creates that registry, and the package contributes its
# invariant entries into it instead of publishing a file over it.
[[asset]]
source = "assets/install/.jit/schemas/jit-content-standards.json"
target = ".jit/schemas/jit-content-standards.json"

[[asset]]
source = "assets/install/.jit/reference/rules-and-gates.md"
target = ".jit/reference/rules-and-gates.md"

# Repository roots the live assets below are drawn from. Each exclusion pattern
# matches a repository-relative path and names a category of repository material
# the package deliberately does not carry, so material of the same shape needs
# no new entry. A tracked file beneath a root that neither an asset packages nor
# a pattern matches fails the suite, so every list here is measured against the
# repository tree rather than maintained by hand.
[[live-source]]
root = ".agents/skills"
exclude = [
  # Skill-evaluation harnesses: cases, fixtures, setup scripts, and the
  # transcripts a run leaves behind.
  ".agents/skills/*/evals/**",
  # Trigger-activation measurements recorded beside a skill's entry point.
  ".agents/skills/*/trigger_eval*.json",
  # Test suites for the packaged scripts they sit beside.
  ".agents/skills/*/scripts/test-*.sh",
  # Placeholders holding a directory that is otherwise empty.
  ".agents/skills/**/.gitkeep",
]

[[live-source]]
root = ".jit/reference"
exclude = []

[[live-source]]
root = "contrib/gates"
exclude = [
  # The contributed prompt library: worked examples an adopter composes a gate
  # from, rather than prompts this workflow's own gates resolve.
  "contrib/gates/prompts/**",
]

