# Workflow contract — what every committed GitHub workflow has to be.
#
# `scripts/workflow-contract.sh` runs a pinned actionlint over the workflows and
# then checks them against the declarations below. A workflow declares its
# static assertions here; it never carries a verifier of its own. The grammar
# and the pin-update procedure are documented in dev/workflow-contract.md.
#
# This is repository policy, not a shipped jit default: nothing under .github/
# is part of the product surface.

version: 1

# Rules that hold for every workflow, declared or not.
global:
  # No workflow file may exist outside this contract, so a new one cannot enter
  # the repository unverified.
  require_declaration: true
  # Every workflow states the token it runs with rather than inheriting the
  # repository default.
  require_workflow_permissions: true
  # No continue-on-error, no condition that survives a failed predecessor, no
  # shell-level suppression of a non-zero exit.
  forbid_failure_escapes: true
  # Every external action and reusable workflow is pinned to a commit SHA and
  # carries the upstream version that SHA was resolved from.
  require_sha_pinned_uses: true
  # Publication is one workflow's business. Every workflow is read for the
  # constructs that create a GitHub release or push to a package or container
  # registry: a release construct outside the workflow named here is a finding,
  # and a registry push is a finding anywhere, because the whole published
  # output of a release is one GitHub release (@/charter/D-16, @/charter/D-9).
  publication:
    github_release: release-publish.yml
    forbid_registry: true

workflows:
  ci.yml:
    triggers:
      required:
        push:
          branches: [main]
        pull_request:
          # This job is the PR workflow gate. Branch or path filters would let
          # a pull request bypass the workflow contract.
          forbidden_filters: [branches, branches-ignore, paths, paths-ignore]
      # A fork pull request must not run with repository write credentials.
      forbidden: [pull_request_target]
    permissions:
      contents: read
    workflow_call:
      # No input and no secret. A caller runs these suites on its own commit;
      # an input would be the knob that lets it aim them somewhere else.
      inputs:
        allowed: []
      secrets:
        allowed: []
    callers:
      # What a caller inherits by calling this workflow: every suite this
      # repository considers normal validation. Each job named below has to
      # exist here and to run unconditionally, and every job a caller runs of
      # its own has to wait for the call.
      require_needs:
        - workflow-contract
        - repo-validate
        - test-rust
        - test-rust-features
        - profile-adoption
        - msrv
        - test-mcp-server
        - test-web-ui
    jobs:
      # The contract check itself: deleting or renaming this job is a finding,
      # so the harness cannot be removed from pull requests silently.
      workflow-contract: {}
      # Badge deployment pushes to the badges branch and is the one job that
      # holds write credentials.
      coverage:
        permissions:
          contents: write

  security-audit.yml:
    triggers:
      required:
        pull_request:
          # The dependency-advisory gate for a pull request. A branch or path
          # filter would let a pull request merge while one of the audits had
          # never run on its commit.
          forbidden_filters: [branches, branches-ignore, paths, paths-ignore]
        workflow_call: {}
        schedule: {}
        workflow_dispatch: {}
        push:
          branches: [main]
      forbidden: [pull_request_target]
    permissions:
      contents: read
    workflow_call:
      # No input and no secret. A caller audits the locks committed at its own
      # commit; an input would be the knob that aims the audits elsewhere.
      inputs:
        allowed: []
      secrets:
        allowed: []
    callers:
      # The three audit boundaries, named one by one. Each has to exist here
      # and to run unconditionally, and every job a caller runs of its own has
      # to reach the call through `needs`. Together that makes each boundary a
      # predecessor of everything a caller does — artifact production and
      # publication alike — so no path gets past a failing audit
      # (@/charter/D-11).
      require_needs:
        - cargo-audit
        - npm-audit-mcp-server
        - npm-audit-web

  docker.yml:
    triggers:
      required:
        push:
          branches: [main]
        pull_request: {}
      # A branch push and a pull request are the only events this workflow
      # answers to: the image is built and smoked here, and a tag reaches
      # publication through release.yml alone.
      allowed: [push, pull_request]
      forbidden: [pull_request_target]
    permissions:
      contents: read
    jobs:
      # The workflow-level read scope is the whole token: no job here writes,
      # so the workflow has no path to any registry.
      build-and-smoke:
        permissions: null

  docs.yml:
    triggers:
      required:
        push:
          branches: [main]
        workflow_dispatch: {}
      forbidden: [pull_request_target]
    # Pages deployment needs the id-token scope for its OIDC exchange.
    permissions:
      contents: read
      pages: write
      id-token: write
    jobs:
      build-and-deploy: {}

  release-artifacts.yml:
    triggers:
      required:
        pull_request:
          # The artifact build is a pull-request gate. A branch or path filter
          # would let a pull request merge while the build the release ships had
          # never run on its commit.
          forbidden_filters: [branches, branches-ignore, paths, paths-ignore]
        workflow_call: {}
      # A pull request and a call from this repository are the only ways in.
      # This workflow answers to no tag: a tag reaches publication through
      # release-publish.yml alone.
      allowed: [pull_request, workflow_call]
      forbidden: [pull_request_target]
    permissions:
      contents: read
    workflow_call:
      # No input and no secret. A caller builds its own commit; an input would
      # be the knob that aims the build at another one.
      inputs:
        allowed: []
      secrets:
        allowed: []
    callers:
      # What a caller inherits by calling this workflow: both shipped artifacts
      # and the smoke test over the extracted archive. Each job named below has
      # to exist here and to run unconditionally, and every job a caller runs of
      # its own has to wait for the call — which is what keeps publication
      # downstream of a smoke test that actually ran.
      require_needs:
        - build-web-ui
        - build-native
        - package-mcp-server
        - smoke
    jobs:
      # The web bundle is compiled into jit-server, so it is a predecessor of
      # the native build rather than a job beside it.
      build-native:
        needs: [build-web-ui]
      # Nothing is smoked that was not built here.
      smoke:
        needs: [build-native]

  release-publish.yml:
    triggers:
      required:
        push:
          tags: ['v*']
      # A tag push is the only thing that may reach publication: no manual
      # dispatch, no branch push, no pull request, no upstream workflow run.
      allowed: [push]
      forbidden: [pull_request_target]
    permissions:
      contents: read
    jobs:
      # The calls this workflow makes, named one by one: a `needs` edge onto a
      # job says nothing about what that job runs, and these three are what give
      # the edges below their content — the normal suites, the audit
      # boundaries, and the built, smoked artifacts.
      validate:
        uses: ./.github/workflows/ci.yml
      security:
        uses: ./.github/workflows/security-audit.yml
      artifacts:
        uses: ./.github/workflows/release-artifacts.yml
        needs: [validate, security]
      # Publication holds the only write scope, and reaches the tag only through
      # validation, the audits, and the smoked artifacts.
      publish:
        permissions:
          contents: write
        needs: [validate, security, artifacts]
