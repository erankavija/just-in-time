name: Container Image

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and Smoke the Server Image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free Disk Space
        run: |
          # Free up disk space on GitHub Actions runners
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build the jit CLI the smoke fixtures seed with
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo build --locked --bin jit
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Build and runtime-smoke the image
        env:
          CONTAINER_ENGINE: docker
          JIT_IMAGE_RUNTIME: '1'
        run: python3 test-vectors/container-image/test_image_contract.py
