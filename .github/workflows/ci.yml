name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The workflow contract checks the workflows themselves: pinned actionlint
  # over every committed workflow, plus this repository's structural assertions
  # from .github/workflow-contract.yml. It runs first and needs no toolchain, so
  # a pull request that edits a workflow learns within a minute that it broke a
  # declared assertion, including on documentation-only pull requests and PRs
  # targeting any base branch.
  # `scripts/workflow-contract-selftest.sh` re-proves that the harness still
  # rejects each defect class it claims to reject.
  workflow-contract:
    name: Workflow Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the contract parser dependency
        run: python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.3'

      - name: Verify the workflow contract
        run: ./scripts/workflow-contract.sh

      - name: Self-test the workflow contract harness
        run: ./scripts/workflow-contract-selftest.sh

      - name: Verify product release versions
        run: python3 scripts/release-version-contract.py

      - name: Self-test the product release-version contract
        run: python3 scripts/release_version_contract_test.py

  test-rust:
    name: Test Rust Components
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Free Disk Space
        run: |
          # Free up disk space on GitHub Actions runners
          # Remove unnecessary tools and packages to make room for Rust builds
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install ripgrep (for search tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      
      - name: Configure git default branch
        run: git config --global init.defaultBranch main
      
      - name: Check formatting
        run: cargo fmt -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Build all crates
        run: cargo build --workspace --verbose
      
      - name: Run tests
        run: cargo test --workspace --verbose
      
      - name: Run integration tests
        run: |
          cd crates/jit
          cargo test --test '*' --verbose

  # Enforce the declared MSRV. The authoritative policy is the single
  # `rust-version` under `[workspace.package]` in Cargo.toml; this job reads it
  # from the manifest (no hand-duplicated version literal) and builds the whole
  # workspace on exactly that pinned toolchain. A change that requires a newer
  # compiler than the declared minimum fails here, keeping the manifest claim
  # honest. `cargo` itself also refuses to build the crates on an older
  # toolchain because of the same `rust-version` field.
  msrv:
    name: MSRV (build on declared rust-version)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 -E '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "Could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build workspace on MSRV toolchain
        run: cargo +${{ steps.msrv.outputs.version }} build --workspace --all-targets --all-features --verbose

  # The html/xml content parsers and their production-dispatch tests are behind
  # optional cargo features that the default `cargo test` build never compiles.
  # The cross-format equality test is `#![cfg(all(feature="html",feature="xml"))]`
  # and the per-issue content_format dispatch tests are `#[cfg(feature = ...)]`,
  # so without this job those production HTML/XML paths would NEVER run in CI.
  test-rust-features:
    name: Test Rust (html + xml features)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install ripgrep (for search tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Run tests with html + xml features
        run: cargo test -p jit --features html,xml --verbose

  profile-adoption:
    name: Profile adoption (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-profile-adoption-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-profile-adoption-
            ${{ runner.os }}-cargo-

      - name: Exercise offline profile adoption
        # Quoted: the `:: ` in the test-path filter would otherwise end the
        # plain scalar and make the whole workflow unparseable YAML.
        run: 'cargo test --locked -p jit --test cli_repo_workflow profile_acceptance_tests:: -- --nocapture'

  coverage:
    name: Coverage Badges
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install ripgrep (for search tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage data
        run: cargo llvm-cov --workspace --json --summary-only --output-path coverage.json

      - name: Generate coverage badges
        run: bash scripts/generate-coverage-badges.sh coverage.json badges

      - name: Deploy badges to badges branch
        run: |
          cd badges
          git init
          git checkout -b badges
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badges [skip ci]"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  test-mcp-server:
    name: Test MCP Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Free Disk Space
        run: |
          # Free up disk space on GitHub Actions runners
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # Note: cache disabled for act compatibility
          # Real GitHub Actions will still benefit from npm's own cache
      
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      
      - name: Install ripgrep (for search tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      
      - name: Configure git default branch
        run: git config --global init.defaultBranch main
      
      - name: Build Rust CLI (needed for MCP tests)
        run: cargo build --release --bin jit
      
      - name: Run MCP tests
        working-directory: mcp-server
        run: |
          export PATH="${GITHUB_WORKSPACE}/target/release:$PATH"
          npm test

  test-web-ui:
    name: Test Web UI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          # Note: cache disabled for act compatibility
          # Real GitHub Actions will still benefit from npm's own cache
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Run linter
        working-directory: web
        run: npm run lint
      
      - name: Run tests
        working-directory: web
        run: npm test
      
      - name: Build for production
        working-directory: web
        run: npm run build

  # Security audit moved to separate weekly workflow (security-audit.yml)
  # This reduces CI time by ~2 minutes per run
  # Run manually with: gh workflow run security-audit.yml
