# Content no package this repository authors may carry, read by
# scripts/docs-check-package-content.sh (M8 of `docs-mechanical`). Each entry
# applies to every packaged file's source, install target and text: `forbid`
# must appear in none of the three, `forbid_token` in no text as a whole word,
# so a longer word containing it is not a finding. Which files are checked is
# whatever each package manifest declares.

[[content]]
topic = "checkout-local and deferred content"
# A package is read at an adopter's destination, where none of these resolve.
forbid = [
  "/home/",
  "crates/jit/",
  "dev/archive/",
  "dev/vision/",
  "docs/examples/research/",
  "/evals/",
  "trigger-evals",
  "LDPC",
  "GLDPC",
  "Nexus",
  "gf2",
  "Kani",
  "AVX",
  "Zen 3",
  "PPC",
  "QAM",
  "SNR",
  "this-repo",
  "this repository",
]

[[content]]
topic = "installed paths require no jq"
# An installed path must work with what jit ships, without a JSON processor.
forbid_token = ["jq"]
