# Policy literals this repository's prose must carry, and the ones it must not.
# Read by scripts/docs-check-policy-phrases.sh (M9 of `docs-mechanical`).
#
# Each `[[document]]` names one artifact and one topic in it. `require` must be
# present, `forbid` absent — a rule this repository removed, which no presence
# check can express — and `exactly_once` present exactly once, for a contract
# whose shape is the assertion. `normalize = true` collapses whitespace runs on
# both sides, for a phrase the artifact may re-wrap; it is weaker than an exact
# match. `section = { after, before }` narrows an entry to the text between two
# markers, for a phrase whose placement is the assertion; a declared marker the
# artifact lacks is itself a finding.
#
# A `[[value]]` entry asserts over a configured value instead: `select` walks
# `file`'s TOML, where `name[field=value]` picks the array element whose `field`
# equals `value`, and every `require` literal must occur in the string it
# resolves to.

# --- contrib/gates/code-review-prompt.md -------------------------------------

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "attribution and fallback"
require = [
  "jit:<short-id>",
  "individual patch",
  "renames and deletions",
  "commit attribution was unavailable",
  "Do not attribute uncommitted changes",
  "issue intent and linked documents",
  "current tree",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "current evidence and debt"
require = [
  "latest recorded status and exit code",
  "newer successful run supersedes older failures",
  "issue-impact",
  "blocking",
  "pre-existing",
  "advisory",
  "explicit evidence",
  "if and only if",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "selective examples"
require = [
  "Do not require a `# Examples` section merely because an API is public",
  "non-obvious-only standard",
  "repetitive examples for straightforward",
  "avoidable documentation and CI burden",
]
forbid = [
  "All public APIs must have doc comments with description and `# Examples`",
]

[[document]]
path = "AGENTS.md"
topic = "selective examples"
require = [
  "Add an example only when it clarifies non-obvious behavior",
  "one type- or module-level walkthrough",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "peer-review gate evidence"
require = [
  "Include every required gate's latest status in the evidence header",
  "peer review or judgment gate",
  "is not by itself an implementation defect",
  "must not create a blocking finding or fail the verdict",
  "Executable CI or validation gate evidence may support a blocking finding",
  "demonstrates an attributable failure",
  "leaves a hard criterion materially unverified",
]
forbid = ["A currently pending, failed, or errored required"]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "policy precedence"
require = [
  "complete prose baseline",
  "repository root",
  "affected path",
  "closer `AGENTS.md`",
  "specializes",
  "unresolved contradiction",
  "blocking",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "bounded addressable policy"
require = [
  "applicable `AGENTS.md`",
  "issue content",
  "relationship labels",
  "linked documents",
  "attributable patches",
  "directly implicated behavior",
  "Do not enumerate every project item",
  "configured source of truth",
  "markdown-first",
  "registry-first",
  "rendered projection",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "relationship evidence claims"
require = [
  "`satisfies:`",
  "`enforces:`",
  "`per:`",
  "evidence claims",
  "dangling",
  "contradictory",
  "unsupported",
  "unrelated pre-existing",
  "advisory",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "evidence header"
exactly_once = [
  "Attribution:",
  "Policy sources:",
  "Resolved items:",
  "Gate evidence:",
  "Truncation recovery:",
]
require = ["use `none` for every empty value"]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "recorded gates and structured references"
require = [
  "latest recorded",
  "Do not rerun a gate that is currently recorded as passing",
  "@/gate/jit-validate",
  "valid resolved qualified IDs",
  "`references`",
  "empty array",
  "repository's configured registries",
  "do not invent, hardcode, or emit unresolved references",
]
forbid = ["@/inv/pid-safety"]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "procedure, not a registry copy"
forbid = [
  "## Review rubric",
  "All file writes use the temp-file + atomic-rename pattern.",
  "Every state change appends an event to events.jsonl.",
  "Every label is namespace:value",
  "Process-signaling code rejects sentinel or lossy PID conversions",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "read-only bounded inspection"
require = [
  "read-only",
  "Do not invoke issue-lifecycle skills",
  "diff statistics",
  "changed-file lists",
  "bounded calls",
  "truncation marker",
  "Do not issue a verdict",
  "disposition",
  "origin",
]

[[document]]
path = "contrib/gates/code-review-prompt.md"
topic = "shared findings contract"
forbid = ["<<<JIT-FINDINGS-JSON", "Before the verdict line"]

# --- the reviewer's sandbox --------------------------------------------------

[[value]]
file = ".jit/gates.toml"
topic = "code-review reviewer sandbox"
# The reviewer is a prompt this repository does not control the output of, run
# over the whole checkout. The explicit read-only sandbox is what makes the
# prompt's inspection-only instruction a boundary rather than a request.
select = "gates[key=code-review].checker.env.REVIEWER_AGENT"
require = ["--sandbox read-only"]

# --- documentation of who owns the review contract ---------------------------

[[document]]
path = "docs/how-to/custom-gates.md"
topic = "review policy resolution"
normalize = true
require = [
  "applicable `AGENTS.md`",
  "qualified IDs",
  "configured source of truth",
  "`references`",
  "repository-specific prompt",
  "tool-agnostic wrapper",
]

[[document]]
path = "docs/how-to/custom-gates.md"
topic = "findings ownership"
normalize = true
require = [
  "The reviewer emits human-readable findings, a structured findings block, and a terminal verdict.",
  "The wrapper transports the prompt and context and determines its checker exit code from the terminal verdict.",
  "jit parses and persists the structured findings block.",
]
forbid = [
  "parses the shared findings and verdict contract",
  "parses the common verdict contract",
]

[[document]]
path = "dev/index.md"
topic = "review policy resolution"
require = [
  "applicable `AGENTS.md`",
  "canonical",
  "engineering prose",
  "Repository-specific review",
  "tool-agnostic",
  "`references`",
]

[[document]]
path = "dev/index.md"
topic = "findings ownership"
normalize = true
require = [
  "The reviewer emits human-readable findings, a structured findings block, and a terminal verdict.",
  "The shared AI-review wrapper stays tool-agnostic: it transports the prompt and context and determines its checker exit code from the terminal verdict.",
  "jit parses and persists the structured findings block.",
]

[[value]]
file = ".jit/gates.toml"
topic = "doc-review gate description"
select = "gates[key=doc-review].description"
require = [
  "issue-scoped",
  "jit:<short-id>",
  "impact cone",
  "pre-existing drift",
  "advisory",
  "concise",
  "fail",
  "repository-configured hierarchy",
  "DAG-resolved descendants",
  "combined documentation contract",
]

[[document]]
path = "contrib/gates/ai-review.sh"
topic = "advisory findings pass"
require = ["passing verdict may include advisory findings"]
forbid = ['Use "pass" with an empty findings array when there are none.']

