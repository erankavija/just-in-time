[[document]]
path = "docs/reference/jit-content-standards.md"
topic = "profile installation redirect"
require = [
  "contributors to the JIT source repository",
  "Ordinary `jit init` does not install it",
  "profile-installed workflow policy",
  "repositories that use plain initialization",
  "`jit init --profile packages/jit-dogfood`",
  "`jit profile apply --profile packages/jit-dogfood`",
  "[Repository Profiles](profiles.md)",
]
forbid = ["does not expose a public profile-install command"]

